{% extends 'base.html' %}

{% block content %}
<div class="form-card">
    <h2>Registrar Manejo Sanitário / Vacinação</h2>
    <form action="{{ url_for('registrar_manejo') }}" method="POST">
        <div class="form-group">
            <label for="brinco">Identificação do Animal (Brinco/ID) *</label>
            <input type="text" id="brinco" name="brinco" placeholder="Ex: BOV-1024" required>
        </div>

        <div class="form-group">
            <label for="peso">Peso Vivo (kg) *</label>
            <input type="number" id="peso" name="peso" step="0.1" min="1" placeholder="Ex: 450.0" required>
        </div>

        <div class="form-group">
            <label for="vacina">Vacina / Insumo *</label>
            <select id="vacina" name="vacina" required>
                <option value="">Selecione...</option>
                <option value="Aftosa">Aftosa</option>
                <option value="Brucelose">Brucelose</option>
                <option value="Raiva Bovina">Raiva Bovina</option>
                <option value="Vermífugo/Antiparasitário">Vermífugo/Antiparasitário</option>
            </select>
        </div>

        <div class="form-group">
            <label for="custo_ml">Custo do Insumo (R$ por mL) *</label>
            <input type="number" id="custo_ml" name="custo_ml" step="0.01" min="0" placeholder="Ex: 1.50" required>
        </div>

        <div class="form-group">
            <label for="data_aplicacao">Data da Aplicação *</label>
            <input type="date" id="data_aplicacao" name="data_aplicacao" required>
        </div>

        <button type="submit" class="btn-submit">Calcular Dosagem & Salvar</button>
    </form>
</div>
{% endblock %}
