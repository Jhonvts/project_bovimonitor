<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BoviMonitor - Cadastro</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>🐄 BoviMonitor</h1>
        <p>Sistema de Controle Sanitário e Manejo de Rebanhos</p>
    </header>

    <main class="container">

        <!-- CADASTRO -->

        <section class="card">

            <h2>Criar uma conta</h2>

            <p class="descricao">
                Cadastre seus dados para acessar o BoviMonitor.
            </p>

            <form action="/cadastro" method="POST">
                <div class="campo">
                    <label for="nome">
                        Nome completo
                    </label>

                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="campo">
                    <label for="cpf">
                        CPF
                    </label>

                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>

                <div class="campo">
                    <label for="telefone">
                        Telefone
                    </label>

                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                </div>

                <div class="campo">
                    <label for="email">
                        E-mail
                    </label>

                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo">
                    <label for="senha">
                        Senha
                    </label>

                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>

                <h3>Dados da propriedade</h3>

                <div class="campo">
                    <label for="propriedade">
                        Nome da propriedade
                    </label>

                    <input type="text" id="propriedade" name="propriedade" placeholder="Ex.: Fazenda Boa Esperança"
                        required>
                </div>

                <div class="campo">
                    <label for="localizacao">
                        Localização
                    </label>

                    <input type="text" id="localizacao" name="localizacao" placeholder="Cidade/Estado" required>
                </div>

                <div class="campo">
                    <label for="area">
                        Área da propriedade (hectares)
                    </label>

                    <input type="number" id="area" name="area" min="0" step="0.01" placeholder="Ex.: 250">
                </div>

                <button type="submit">
                    Criar conta
                </button>

            </form>

        </section>


        <!-- LOGIN -->

        <section class="card">

            <h2>Já possui uma conta?</h2>

            <p class="descricao">
                Entre no BoviMonitor para acessar seu perfil.
            </p>

            <form action="/login" method="POST">

                <div class="campo">

                    <label for="login_email">
                        E-mail
                    </label>

                    <input type="email" id="login_email" name="email" placeholder="Digite seu e-mail" required>

                </div>

                <div class="campo">

                    <label for="login_senha">
                        Senha
                    </label>

                    <input type="password" id="login_senha" name="senha" placeholder="Digite sua senha" required>

                </div>

                <button type="submit">
                    Entrar
                </button>

            </form>

        </section>

    </main>

    <footer>

        <p>
            BoviMonitor - Sistema de Controle Sanitário e Manejo de Rebanhos
        </p>

    </footer>

</body>

</html>
