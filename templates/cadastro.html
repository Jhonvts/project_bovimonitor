<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BoviMonitor - Cadastro</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>🐄 BoviMonitor</h1>

        <p>
            Sistema de Controle Sanitário e Manejo de Rebanhos
        </p>
    </header>

    <main class="container">

        <section class="card">

            <h2>Criar uma conta</h2>

            <p class="descricao">
                Cadastre seus dados para acessar o BoviMonitor.
            </p>

            <form action="/cadastro" method="POST">

                <div class="campo">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="telefone">
                        Celular
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>

                <button type="submit">
                    Criar conta
                </button>

            </form>

            <p>
                Já possui uma conta?
                <a href="/login">
                    Entrar
                </a>
            </p>

        </section>

    </main>

    <footer>

        <p>
            BoviMonitor - Sistema de Controle Sanitário e Manejo de Rebanhos
        </p>

    </footer>

</body>

</html>
