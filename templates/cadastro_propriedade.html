<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BoviMonitor - Cadastrar Propriedade</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <header>

        <h1>🐄 BoviMonitor</h1>

        <p>
            Sistema de Controle Sanitário e Manejo de Rebanhos
        </p>

    </header>


    <main class="container">

        <section class="card">

            <h2>Cadastrar Propriedade</h2>

            <p class="descricao">
                Cadastre sua propriedade para utilizar o sistema.
            </p>


            <form action="/propriedade/cadastrar"
                  method="POST">


                <div class="campo">

                    <label for="nome">
                        Nome da propriedade
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Ex.: Fazenda Boa Esperança"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="localizacao">
                        Localização
                    </label>

                    <input
                        type="text"
                        id="localizacao"
                        name="localizacao"
                        placeholder="Ex.: Ariquemes - RO"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="area">
                        Área (hectares)
                    </label>

                    <input
                        type="number"
                        id="area"
                        name="area"
                        step="0.01"
                        min="0"
                        placeholder="Ex.: 120"
                        required
                    >

                </div>


                <button type="submit">
                    Cadastrar propriedade
                </button>

            </form>


            <p>

                <a href="/perfil">
                    Voltar para o perfil
                </a>

            </p>

        </section>

    </main>


    <footer>

        <p>
            BoviMonitor - Sistema de Controle Sanitário e Manejo de Rebanhos
        </p>

    </footer>

</body>

</html>
