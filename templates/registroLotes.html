<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Lotes</title>
</head>

<body>

    <h1>Registro de Lotes de Gado</h1>

    <p>
        Cadastre os lotes e registre a quantidade de cabeças de gado.
    </p>

    <hr>

    <h2>Cadastrar Novo Lote</h2>

    <form>

        <label for="nome">Nome do lote:</label>
        <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Ex.: Lote 01"
            required
        >

        <br><br>

        <label for="quantidade">Quantidade de cabeças:</label>
        <input
            type="number"
            id="quantidade"
            name="quantidade"
            placeholder="Ex.: 100"
            min="0"
            required
        >

        <br><br>

        <label for="tendas">Tendas/Áreas:</label>
        <input
            type="number"
            id="tendas"
            name="tendas"
            placeholder="Ex.: 2"
            min="0"
        >

        <br><br>

        <label for="status">Status:</label>
        <select id="status" name="status">
            <option value="ativo">Ativo</option>
            <option value="inativo">Inativo</option>
        </select>

        <br><br>

        <button type="submit">Registrar Lote</button>

    </form>

    <hr>

    <h2>Lotes Registrados</h2>

    <table border="1">

        <thead>
            <tr>
                <th>Nome do Lote</th>
                <th>Quantidade de Cabeças</th>
                <th>Tendas/Áreas</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>Lote 01</td>
                <td>100</td>
                <td>2</td>
                <td>Ativo</td>
                <td>
                    <button>Editar</button>
                    <button>Excluir</button>
                </td>
            </tr>

            <tr>
                <td>Lote 02</td>
                <td>75</td>
                <td>1</td>
                <td>Ativo</td>
                <td>
                    <button>Editar</button>
                    <button>Excluir</button>
                </td>
            </tr>

        </tbody>

    </table>

</body>

</html>
