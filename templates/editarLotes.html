{% extends 'base1.html' %}

{% block title %}Editar Lote - BoviMonitor{% endblock %}

{% block content %}

<div class="form-card">

    <h2>Editar Lote</h2>
    <p class="descricao">Atualize as informações do lote cadastrado.</p>

    <form method="POST">

        <div class="form-group">
            <label for="nome">Nome do lote:</label>
            <input
                type="text"
                id="nome"
                name="nome"
                value="{{ lote.nome }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="quantidade">Quantidade de cabeças:</label>
            <input
                type="number"
                id="quantidade"
                name="quantidade"
                value="{{ lote.quantidade }}"
                min="0"
                required
            >
        </div>

        <div class="form-group">
            <label for="tendas">Tendas/Áreas:</label>
            <input
                type="number"
                id="tendas"
                name="tendas"
                value="{{ lote.tendas }}"
                min="0"
            >
        </div>

        <div class="form-group">
            <label for="status">Status:</label>
            <select id="status" name="status">
                <option value="ativo"
                    {% if lote.status == 'ativo' %}selected{% endif %}>
                    Ativo
                </option>
                <option value="inativo"
                    {% if lote.status == 'inativo' %}selected{% endif %}>
                    Inativo
                </option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Salvar Alterações</button>

        <a href="{{ url_for('registro_lotes') }}" class="btn-cancel" style="text-align: center; text-decoration: none;">Cancelar</a>

    </form>

</div>

{% endblock %}
