{% extends "base.html" %}
{% block title %}Editar manejo · BoviMonitor{% endblock %}
{% block content %}
<section class="panel narrow">
    <div class="eyebrow">HISTÓRICO SANITÁRIO</div>
    <h1>Editar manejo</h1>
    <form method="post" class="form-stack">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Lote<select name="lote_id" required>{% for lote in lotes %}<option value="{{ lote.id }}" {% if
                    lote.id==manejo.lote_id %}selected{% endif %}>{{ lote.nome }} ({{ lote.quantidade_cabecas }}
                    cabeças)</option>{% endfor %}</select></label>
        <label>Vacina/medicamento<select name="vacina_id" required>{% for vacina in vacinas %}<option
                    value="{{ vacina.id }}" {% if vacina.id==manejo.vacina_id %}selected{% endif %}>{{ vacina.nome }} —
                    {{ vacina.dias_carencia }} dia(s)</option>{% endfor %}</select></label>
        <label>Data da aplicação<input type="date" name="data_aplicacao" required
                value="{{ manejo.data_aplicacao.isoformat() }}"></label>
        <label>Observação<input name="observacao" maxlength="300" value="{{ manejo.observacao or '' }}"></label>
        <div class="actions"><button class="button" type="submit">Salvar alterações</button><a
                class="button button-outline" href="{{ url_for('manejos') }}">Cancelar</a></div>
    </form>
</section>
{% endblock %}
