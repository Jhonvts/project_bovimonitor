{% extends 'base.html' %}

{% block title %}Editar Vacina - BoviMonitor{% endblock %}

{% block content %}

<div class="form-card">

    <h2>Editar Vacina ou Medicamento</h2>

    <form action="{{ url_for('editar_vacina', id=vacina.id) }}" method="POST">

        <div class="form-group">
            <label for="nome">Nome da vacina ou medicamento</label>

            <input
                type="text"
                id="nome"
                name="nome"
                value="{{ vacina.nome }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="tipo">Tipo</label>

            <select id="tipo" name="tipo" required>

                <option value="Vacina"
                    {% if vacina.tipo == 'Vacina' %}selected{% endif %}>
                    Vacina
                </option>

                <option value="Medicamento"
                    {% if vacina.tipo == 'Medicamento' %}selected{% endif %}>
                    Medicamento
                </option>

            </select>
        </div>

        <div class="form-group">
            <label for="dias_carencia">Dias de carência</label>

            <input
                type="number"
                id="dias_carencia"
                name="dias_carencia"
                value="{{ vacina.dias_carencia }}"
                min="0"
                required
            >
        </div>

        <div class="form-group">
            <label for="obrigatoria">Vacina obrigatória?</label>

            <select id="obrigatoria" name="obrigatoria" required>

                <option value="sim"
                    {% if vacina.obrigatoria == 'sim' %}selected{% endif %}>
                    Sim
                </option>

                <option value="nao"
                    {% if vacina.obrigatoria == 'nao' %}selected{% endif %}>
                    Não
                </option>

            </select>
        </div>

        <button type="submit" class="btn-submit">
            Salvar Alterações
        </button>

        <a href="{{ url_for('historico_vacinas') }}" class="btn-cancel">
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
